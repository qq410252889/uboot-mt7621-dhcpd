name: Build u-boot by board
on:
  workflow_dispatch:
    inputs:
      model:
        description: '设备型号，例如：zte_e8820s'
        required: true
        type: string
        default: 'zte_e8820s'
      warninginfo:
        description: '警告：这些配置文件来自自动迁移。
          配置文件仓库 <https://github.com/Yuzhii0718/uboot-mt7621-dhcpd/tree/main/configs-mt7621> 不受信任！
          编译前务必确认配置适合你的设备！
          使用前请阅读 README <https://github.com/Yuzhii0718/uboot-mt7621-dhcpd/blob/main/README.md>！
          错误刷写有变砖风险，一切后果自行承担！'
        required: true
        type: boolean
        default: false
      warning:
        description: '我已阅读 README 和警告信息，自愿承担风险继续编译！'
        required: true
        type: boolean
        default: false
      confirm:
        description: '我没有阅读警告信息，只是盲目勾选所有选项。请终止本次工作流！'
        required: true
        type: boolean
        default: false
      pub_release:
        description: '发布到 GitHub Release'
        required: false
        default: true
        type: boolean
      release_draft_mode:
        description: '创建草稿 Release（勾选后需要手动去 GitHub 页面正式发布）'
        required: false
        default: true
        type: boolean
      mark_as_prerelease:
        description: '标记为预发布版本（测试版）'
        required: false
        default: true
        type: boolean
      release_title_prefix:
        description: 'Release 标题前缀（留空则不加前缀）'
        required: false
        type: string
        default: 'BOARD-'
      release_note:
        description: '自定义备注（填写本次编译说明，留空不显示）'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: 编译 MT7621 U-Boot
    runs-on: ubuntu-latest
    strategy:
       fail-fast: False
    outputs:
      timestamp: ${{ steps.timestamp.outputs.now }}
    steps:
      - name: 校验用户是否确认风险警告
        if: ${{ !inputs.warning || !inputs.warninginfo }}
        run: |
          echo "运行前请确认勾选风险警告！"
          exit 1
      - name: 校验用户是否盲目勾选
        if: ${{ inputs.confirm }}
        run: |
          echo "请阅读警告信息后再运行工作流！"
          exit 1
      - name: 检出源码目录
        uses: actions/checkout@v5
        with:
          path: uboot-mt7621
      - name: 安装依赖软件包
        run: |
          sudo apt-get update
          sudo apt-get install swig python2-dev
          echo '切换 python2 为默认 python'
          sudo rm /usr/bin/python
          sudo ln -s /usr/bin/python2 /usr/bin/python
      - name: 下载 OpenWrt 交叉工具链
        run: |
          wget -O - https://github.com/DragonBluep/uboot-mt7621/releases/download/20230517/openwrt-toolchain-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz \
            | tar --xz -xf -
      - name: 执行编译
        working-directory: uboot-mt7621
        run: |
          mkdir -p archive
          BOARD=${{ inputs.model }} ./build.sh | tee "archive/${{ inputs.model }}-build.log"
      - name: 生成时间戳
        id: timestamp
        run: echo "now=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_OUTPUT
      - name: 重命名固件文件
        run: |
          for file in uboot-mt7621/archive/*; do
            filename=$(basename "$file")
            extension="${filename##*.}"
            name="${filename%.*}"
            mv "$file" "uboot-mt7621/archive/${name}-${{ steps.timestamp.outputs.now }}.${extension}"
          done
      - name: 上传固件到 Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.model }}-${{ steps.timestamp.outputs.now }}-uboot
          path: "uboot-mt7621/archive/"

  release:
    name: 创建 GitHub Release
    needs: build
    if: ${{ inputs.pub_release }}
    runs-on: ubuntu-latest
    steps:
      - name: 下载编译产物
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.model }}-${{ needs.build.outputs.timestamp }}-uboot
          path: archive
      - name: 检出仓库用于 Tag 判断
        uses: actions/checkout@v5
      - name: 检查 Tag 是否已存在
        id: tag_check
        run: |
          TAG_NAME=${{ inputs.model }}-${{ needs.build.outputs.timestamp }}
          if git rev-parse "tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.tag_check.outputs.exists == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ inputs.release_title_prefix }}${{ inputs.model }}-${{ needs.build.outputs.timestamp }}
          body: |
            - 提交 SHA: ${{ github.sha }}
            - 编译时间: ${{ needs.build.outputs.timestamp }} (UTC)
            - ---
            - 设备型号: ${{ inputs.model }}
            ${{ inputs.release_draft_mode && '> 这是草稿 Release，请检查固件后手动在 GitHub 页面发布。' || '> 已自动发布 Release。' }}
            ${{ inputs.mark_as_prerelease && '> 此版本标记为预发布测试版。' || '> 此版本标记为稳定正式版。' }}
            ${{ inputs.release_note != '' && '> 自定义备注：' ~ inputs.release_note || '' }}
          files: archive/*
          tag_name: ${{ inputs.model }}-${{ needs.build.outputs.timestamp }}
          retry_count: 6
          retry_delay: 10000
          draft: ${{ inputs.release_draft_mode }}
          prerelease: ${{ inputs.mark_as_prerelease }}
